name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B verify
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/watchtower-sdk-*.jar'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/watchtower-sdk-*.jar --generate-notes --verify-tag
      - run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
