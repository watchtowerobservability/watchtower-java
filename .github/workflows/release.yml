name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B verify
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/watchtower-sdk-*.jar'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/watchtower-sdk-*.jar --generate-notes --verify-tag
      - run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Rewrites settings.xml with the Central server (replaces the GitHub Packages one, already used above)
      # and imports the signing key into gpg.
      - uses: actions/setup-java@v4
        if: env.MAVEN_CENTRAL_USERNAME != '' && env.SIGNING_KEY != ''
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
      # Maven Central through the Central Portal publishing plugin (release profile: sources, javadoc,
      # gpg, autoPublish). Skipped when the secrets are unset or the version is already on Central.
      - name: Maven Central
        if: env.MAVEN_CENTRAL_USERNAME != '' && env.SIGNING_KEY != ''
        run: |
          V=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if curl -fsI "https://repo1.maven.org/maven2/io/github/watchtowerobservability/watchtower-sdk/$V/" >/dev/null; then
            echo "watchtower-sdk $V is already on Maven Central"; exit 0
          fi
          mvn -B -Prelease deploy -DskipTests
